[workspace]
resolver = "2"
members = [
    "key-encryption",
    "key-generation",
    "sig-compare",
]

[workspace.dependencies]
dotenv = "0.15.0"
aes-gcm = "0.11.0"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
rand = "0.8"
hex = "0.4.3"
secp256k1 = "0.31.1"
alloy-signer-local = { version = "2.4.1", features = ["mnemonic"] }
ethers = { version = "2.0"}
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
sha3 = "0.12.0"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"