[workspace]
resolver = "2"
members = [
    "key-encryption",
    "key-generation",
    "sig-compare",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
dotenvy = "0.15.7"
aes-gcm = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
rand = "0.8"
hex = "0.4.3"
secp256k1 = "0.31.1"
alloy-signer-local = { version = "2.4.1", features = ["mnemonic"] }
alloy = { version = "2.4.1", default-features = false, features = ["provider-http", "rpc-types", "signer-local", "consensus", "reqwest"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
sha3 = "0.12.0"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"